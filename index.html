<!DOCTYPE html>
<html lang="en" class="scroll-smooth overflow-x-hidden w-full max-w-full box-border">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Selective Vacations — Bespoke Luxury India Journeys</title>
  <meta name="description" content="Selective Vacations — a high-end luxury domestic Indian tour agency crafting bespoke journeys: palaces, backwaters, deserts and Himalayas." />

  <!-- Fonts: Inter (modern geometric sans) + Jost (supporting sans) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet" />

  <!-- Global styles -->
  <link rel="stylesheet" href="./css/styles.css" />

  <!-- Tailwind Play CDN (static implementation — no build step required) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Selective Vacations — Peacock & Gold design tokens
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            peacock: {
              DEFAULT: '#0b3c49',
              dark: '#071e26',
              midnight: '#071e26',
              teal: '#0b3c49',
              turquoise: '#1d8392',
              emerald: '#0f4c3a',
            },
            gold: {
              DEFAULT: '#d4af37',
              light: '#e8c96a',
              dark: '#a88624',
            },
            luxury: {
              mustard: '#e69a28',
              coral: '#d1603d',
              ivory: '#f4f6f7',
            },
            cream: {
              DEFAULT: '#faf9f6',
              warm: '#fcfbf9',
            },
          },
          fontFamily: {
            display: ['Inter', 'Jost', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'Jost', 'system-ui', 'sans-serif'],
            body: ['Inter', 'Jost', 'system-ui', 'sans-serif'],
          },
        },
      },
    };
  </script>

  <style>
    /* Critical base: rich cream canvas + peacock ink */
    html, body {
      background-color: #f4f1ea;
      color: #071e26;
      overflow-x: hidden;
      overflow-x: clip;
      width: 100%;
      max-width: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    *, *::before, *::after { box-sizing: border-box; }
  </style>
  <style>
    *, *::before, *::after {
      box-sizing: border-box !important;
    }
    html, body {
      width: 100vw !important;
      max-width: 100vw !important;
      overflow-x: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      background-color: #faf9f6 !important;
    }
    .hero-container, header, main, section {
      width: 100% !important;
      max-width: 100% !important;
      margin-left: 0 !important;
      margin-right: 0 !important;
      left: 0 !important;
      right: 0 !important;
    }
  </style>
  <style>
    html {
      width: 100% !important;
      overflow-x: hidden !important;
    }
    body {
      width: 100% !important;
      max-width: 100% !important;
      overflow-x: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      position: relative !important;
    }
    /* Force all full-width sections to span edge-to-edge without shifting */
    section, header, div {
      box-sizing: border-box !important;
    }
  </style>
  <style>
    /* Custom Sleek Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #faf9f6;
    }
    ::-webkit-scrollbar-thumb {
      background: #071e26;
      border-radius: 0px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #d4af37;
    }
  </style>
  <style>
    /* Single-screen viewport lock: zero vertical scrolling */
    html, body {
      height: 100vh !important;
      overflow: hidden !important;
      background-color: #faf9f6 !important;
    }
  </style>
</head>

<body class="bg-[#f4f1ea] text-peacock-midnight font-body antialiased w-full max-w-full overflow-x-hidden p-0 m-0 box-border">

  <!-- ================= BLOCK 1: Navbar ================= -->
  <header id="navbar" class="fixed top-0 inset-x-0 z-50 overflow-hidden w-full max-w-full box-border m-0 p-0 bg-[#f4f1ea]/85 backdrop-blur-md border-b border-peacock-midnight/10">
    <div class="relative mx-auto w-full max-w-7xl box-border px-6 sm:px-8 lg:px-10">
      <!-- Centered brand -->
      <div class="flex h-16 items-center justify-center">
        <a href="#hero" class="flex items-center gap-3 shrink-0" aria-label="Selective Vacations home">
          <span class="font-display text-xs sm:text-sm font-light tracking-[0.25em] text-peacock-midnight">
            SELECTIVE VACATIONS
          </span>
        </a>
      </div>
      <!-- Centered micro nav -->
      <nav class="hidden lg:flex h-11 items-center justify-center gap-1 text-[11px] font-normal tracking-[0.26em] uppercase" aria-label="Primary">
        <a href="#destinations" class="nav-link px-4 py-1.5 rounded-none text-peacock-midnight/65 transition-all duration-300 ease-out hover:bg-peacock-midnight hover:text-gold">Destinations</a>
        <a href="#circuits" class="nav-link px-4 py-1.5 rounded-none text-peacock-midnight/65 transition-all duration-300 ease-out hover:bg-peacock-midnight hover:text-gold">Royal Circuits</a>
        <a href="#itineraries" class="nav-link px-4 py-1.5 rounded-none text-peacock-midnight/65 transition-all duration-300 ease-out hover:bg-peacock-midnight hover:text-gold">Itineraries</a>
        <a href="#about" class="nav-link px-4 py-1.5 rounded-none text-peacock-midnight/65 transition-all duration-300 ease-out hover:bg-peacock-midnight hover:text-gold">About Us</a>
      </nav>
      <!-- Contact + mobile toggle (absolute right) -->
      <div class="absolute right-6 sm:right-8 lg:right-10 top-8 -translate-y-1/2 flex items-center gap-3">
        <a href="#plan" class="hidden sm:inline-flex items-center rounded-none bg-peacock-midnight px-6 py-2.5 text-[11px] font-medium tracking-[0.2em] uppercase text-[#faf9f6] transition-colors duration-300 hover:bg-peacock-teal">
          Contact
        </a>
        <button id="menu-btn" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="Open menu"
          class="lg:hidden inline-flex h-10 w-10 items-center justify-center rounded-none border border-peacock-midnight/20 text-peacock-midnight transition-all duration-300 hover:bg-peacock-midnight hover:text-gold">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden lg:hidden overflow-hidden w-full max-w-full box-border border-t border-peacock-midnight/10 bg-[#f4f1ea]/95 backdrop-blur-md">
      <div class="w-full max-w-full box-border px-5 py-5 flex flex-col gap-1 text-sm tracking-[0.16em] uppercase">
        <a href="#destinations" class="rounded-none px-3 py-3 text-peacock-midnight/80 transition-all duration-300 ease-out hover:bg-peacock-midnight hover:text-gold">Destinations</a>
        <a href="#circuits" class="rounded-none px-3 py-3 text-peacock-midnight/80 transition-all duration-300 ease-out hover:bg-peacock-midnight hover:text-gold">Royal Circuits</a>
        <a href="#itineraries" class="rounded-none px-3 py-3 text-peacock-midnight/80 transition-all duration-300 ease-out hover:bg-peacock-midnight hover:text-gold">Itineraries</a>
        <a href="#about" class="rounded-none px-3 py-3 text-peacock-midnight/80 transition-all duration-300 ease-out hover:bg-peacock-midnight hover:text-gold">About Us</a>
        <a href="#plan" class="mt-2 inline-flex items-center justify-center rounded-none bg-peacock-midnight px-6 py-2.5 text-[12px] font-medium tracking-[0.2em] uppercase text-[#faf9f6] transition-colors duration-300 hover:bg-peacock-teal">Contact</a>
      </div>
    </div>
  </header>

  <main class="overflow-x-hidden w-full max-w-full box-border m-0 p-0 bg-transparent">
    <!-- ================= BLOCK 1: Cinematic Hero ================= -->
    <section id="hero" class="relative overflow-hidden w-full max-w-full box-border m-0 p-0 min-h-[100vh] flex flex-col">
      <!-- Local cinematic carousel: crossfade every ~3.5s (see js/main.js) -->
      <div class="absolute inset-0 w-full max-w-full overflow-hidden box-border m-0 p-0 bg-peacock-midnight" aria-hidden="true">
        <img data-hero-slide src="./udaipur.jpg" alt="Udaipur palace on the lake"
          fetchpriority="high" loading="eager" decoding="async"
          class="hero-slide absolute inset-0 h-full w-full max-w-full box-border object-cover transition-opacity duration-1000 ease-in-out opacity-100" />
        <img data-hero-slide src="./kerela (1).jpg" alt="Kerala backwater houseboat" loading="lazy" decoding="async"
          class="hero-slide absolute inset-0 h-full w-full max-w-full box-border object-cover transition-opacity duration-1000 ease-in-out opacity-0" />
        <img data-hero-slide src="./varanasi.jpg" alt="Varanasi ghats at golden hour" loading="lazy" decoding="async"
          class="hero-slide absolute inset-0 h-full w-full max-w-full box-border object-cover transition-opacity duration-1000 ease-in-out opacity-0" />
        <img data-hero-slide src="./Mountain.jpg" alt="Snowy Himalayan peaks" loading="lazy" decoding="async"
          class="hero-slide absolute inset-0 h-full w-full max-w-full box-border object-cover transition-opacity duration-1000 ease-in-out opacity-0" />
      </div>
      <!-- Deep peacock grade overlay for punchy, readable type -->
      <div class="absolute inset-0 bg-gradient-to-t from-[#071e26] via-transparent to-[#071e26]/40" aria-hidden="true"></div>

      <!-- Quiet-luxury editorial content — vast, atmospheric, left-aligned -->
      <div class="relative z-10 mx-auto flex flex-1 w-full max-w-7xl box-border items-center px-6 sm:px-10 lg:px-16 pt-28 md:pt-32 pb-10">
        <div class="max-w-2xl">
          <p data-reveal class="text-[11px] font-normal tracking-[0.42em] uppercase text-gold/70">[ Private Residences — 01 ]</p>

          <h1 data-reveal class="mt-8 font-sans font-semibold tracking-tight leading-[1.1] text-3xl sm:text-4xl antialiased text-white">
            UNVEILING INDIA&rsquo;S<br />
            MOST GUARDED SANCTUARIES.
          </h1>

          <p data-reveal data-reveal-delay="120" class="mt-5 font-sans text-sm font-normal lowercase tracking-wide text-white/75">
            raw heritage. untamed luxury.
          </p>

          <div data-reveal data-reveal-delay="200" class="mt-8 flex flex-wrap items-center gap-x-12 gap-y-6">
            <a href="#plan" class="inline-flex items-center rounded-none bg-gold px-6 py-2.5 text-[12px] font-medium tracking-[0.2em] uppercase text-peacock-midnight transition-colors duration-300 hover:bg-gold-light">Contact</a>
            <a href="#destinations" class="group relative inline-flex items-center gap-2 pb-1 text-[12px] font-normal tracking-[0.22em] uppercase text-white/75 transition-colors duration-300 hover:text-gold">
              Explore Archives
              <span aria-hidden="true" class="transition-transform duration-300 group-hover:translate-x-1">→</span>
              <span class="absolute bottom-0 left-0 h-px w-0 bg-gold transition-all duration-500 group-hover:w-full" aria-hidden="true"></span>
            </a>
          </div>
        </div>
      </div>

      <!-- Bottom search bar with architect inquiry action: unified dark glass -->
      <div id="plan" class="relative z-10 mx-auto w-full max-w-4xl box-border px-6 sm:px-8 pb-12">
        <form action="mailto:concierge@selectivevacations.in" method="get"
          class="max-w-4xl mx-auto w-full box-border flex flex-col gap-2 rounded-none bg-[#071e26]/90 backdrop-blur-md p-4 shadow-none md:flex-row md:items-stretch md:gap-0 md:py-2 md:pl-6 md:pr-2"
          aria-label="Plan a bespoke journey">
          <div class="flex-1 w-full max-w-full box-border md:pr-5">
            <label for="region" class="block text-[10px] font-medium tracking-[0.24em] uppercase text-white/50">Region</label>
            <select id="region" name="region"
              class="mt-1 w-full max-w-full box-border bg-transparent text-sm font-normal tracking-wide text-white outline-none cursor-pointer [&>option]:bg-peacock-midnight">
              <option>Rajasthan</option>
              <option>Golden Triangle</option>
              <option>Himalayas</option>
              <option>Coastal Retreats</option>
            </select>
          </div>
          <div class="hidden md:block w-px self-stretch bg-white/10 mx-1" aria-hidden="true"></div>
          <div class="flex-1 w-full max-w-full box-border md:px-5">
            <label for="window" class="block text-[10px] font-medium tracking-[0.24em] uppercase text-white/50">Travel Window</label>
            <input id="window" name="window" type="month"
              class="mt-1 w-full max-w-full box-border bg-transparent text-sm font-normal tracking-wide text-white outline-none [color-scheme:dark]" />
          </div>
          <div class="hidden md:block w-px self-stretch bg-white/10 mx-1" aria-hidden="true"></div>
          <div class="flex-1 w-full max-w-full box-border md:px-5">
            <label for="guests" class="block text-[10px] font-medium tracking-[0.24em] uppercase text-white/50">Guests</label>
            <select id="guests" name="guests"
              class="mt-1 w-full max-w-full box-border bg-transparent text-sm font-normal tracking-wide text-white outline-none cursor-pointer [&>option]:bg-peacock-midnight">
              <option>2 Guests</option>
              <option>1 Guest</option>
              <option>3 – 4 Guests</option>
              <option>5+ / Private Group</option>
            </select>
          </div>
          <div class="flex items-stretch w-full md:w-auto max-w-full box-border md:pl-3">
            <button type="submit"
              class="inline-flex w-full md:w-auto items-center justify-center gap-2 rounded-none bg-gold px-8 py-3.5 md:py-3 text-[11px] font-semibold tracking-[0.18em] uppercase text-peacock-midnight transition-all duration-300 ease-out hover:bg-gold-light whitespace-nowrap">
              Inquire with a Private Travel Architect
              <span aria-hidden="true">-&gt;</span>
            </button>
          </div>
        </form>
      </div>

      <!-- Bottom blend melts into the cream canvas (see light gradient above) -->
    </section>

  </main>

  <script src="./js/main.js"></script>
</body>
</html>
